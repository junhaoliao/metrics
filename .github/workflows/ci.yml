name: Publish metrics Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: metrics-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to GitHub registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Collect image metadata
        id: metadata
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "full_tag=v$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.0-beta$ ]]; then
            echo "compat_tag=v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}-beta" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/junhaoliao/metrics:latest \
            -t ghcr.io/junhaoliao/metrics:${{ steps.metadata.outputs.full_tag }} \
            .
      - name: Add beta compatibility tag
        if: steps.metadata.outputs.compat_tag != ''
        run: docker tag ghcr.io/junhaoliao/metrics:latest ghcr.io/junhaoliao/metrics:${{ steps.metadata.outputs.compat_tag }}
      - name: Publish Docker images
        run: |
          docker push ghcr.io/junhaoliao/metrics:latest
          docker push ghcr.io/junhaoliao/metrics:${{ steps.metadata.outputs.full_tag }}
      - name: Publish beta compatibility tag
        if: steps.metadata.outputs.compat_tag != ''
        run: docker push ghcr.io/junhaoliao/metrics:${{ steps.metadata.outputs.compat_tag }}
